# Deploys the payment and social Edge Functions to the Pharmacourse Supabase project on every push that changes them.
# One-time setup (no developer needed afterwards):
#   1. supabase.com > Account > Access Tokens > Generate new token.
#   2. GitHub repo > Settings > Secrets and variables > Actions > New repository secret:
#        Name: SUPABASE_ACCESS_TOKEN   Value: the token
#   3. GitHub > Actions > "Deploy Supabase functions" > Run workflow (first deploy). Later pushes deploy by themselves.
# Provider keys are NOT stored here: super admins paste them in Admin > Payments > Payment methods (Supabase Vault).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nnjiutikutsjvggakvvv
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the top of this file)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy payment and social functions
        run: |
          for fn in payments-mpesa payments-paystack social-publish; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
