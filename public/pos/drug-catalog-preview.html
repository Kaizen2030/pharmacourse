<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8f5" />
    <title>Drug Image Catalog | RemedacarePOS</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #17251d; background: #f4f8f5; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { position: sticky; top: 0; z-index: 2; background: rgba(244, 248, 245, .96); border-bottom: 1px solid #dce7df; padding: 20px clamp(16px, 4vw, 48px); backdrop-filter: blur(10px); }
      .head { max-width: 1440px; margin: 0 auto; display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 22px; line-height: 1.2; }
      #count { color: #53655a; font-size: 13px; margin-top: 6px; }
      input { width: min(420px, 100%); border: 1px solid #bdcdc2; border-radius: 7px; background: #fff; color: inherit; padding: 11px 13px; font: inherit; }
      main { max-width: 1440px; padding: 22px clamp(16px, 4vw, 48px) 48px; margin: 0 auto; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(174px, 1fr)); gap: 11px; }
      article { min-width: 0; background: #fff; border: 1px solid #e0e8e2; border-radius: 7px; overflow: hidden; }
      .photo { height: 150px; background: #fff; border-bottom: 1px solid #edf1ee; display: grid; place-items: center; padding: 9px; }
      .photo img { width: 100%; height: 100%; object-fit: contain; }
      .details { padding: 10px 11px 12px; }
      .name { font-size: 12px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
      .category { color: #66776b; font-size: 10px; margin-top: 4px; }
      .empty { grid-column: 1 / -1; padding: 32px 12px; color: #53655a; text-align: center; }
      @media (max-width: 520px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .photo { height: 128px; } }
    </style>
    <script type="module" crossorigin src="./assets/drugCatalogPreview-BPbJb7Cl.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/pptDrugCatalog-BDU5tsnA.js">
  </head>
  <body>
    <header>
      <div class="head">
        <div>
          <h1>Drug Image Catalog</h1>
          <div id="count" aria-live="polite"></div>
        </div>
        <input id="search" type="search" placeholder="Search drug or brand" aria-label="Search drug image catalog" />
      </div>
    </header>
    <main><section id="grid" aria-label="Image-backed drug products"></section></main>
  </body>
</html>
