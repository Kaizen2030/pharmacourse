<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening RemedacarePOS...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f0;
      font-family: "Segoe UI", sans-serif;
      color: #12312a;
    }
    .card {
      width: min(460px, calc(100vw - 48px));
      background: #fff;
      border: 1px solid #e7ece8;
      border-radius: 18px;
      padding: 36px 28px;
      box-shadow: 0 18px 42px rgba(15, 110, 86, 0.08);
      text-align: center;
    }
    .logo {
      font-size: 54px;
      line-height: 1;
      margin-bottom: 12px;
      color: #0f6e56;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      color: #0f6e56;
    }
    p {
      margin: 12px 0 0;
      font-size: 15px;
      line-height: 1.5;
      color: #4f645f;
    }
    .status {
      margin-top: 18px;
      font-size: 14px;
      color: #7a8d87;
    }
    .error {
      margin-top: 18px;
      color: #a32d2d;
      font-weight: 600;
    }
    .link {
      display: inline-block;
      margin-top: 18px;
      color: #0f6e56;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Rx</div>
    <h1>RemedacarePOS</h1>
    <p>Opening the desktop app so you can continue your password reset securely.</p>
    <div id="status" class="status">Preparing reset session...</div>
    <div id="error" class="error" hidden></div>
    <a id="manual-link" class="link" hidden href="#">Open RemedacarePOS manually</a>
  </div>

  <script>
    (function () {
      const statusEl = document.getElementById('status')
      const errorEl = document.getElementById('error')
      const manualLinkEl = document.getElementById('manual-link')

      function setError(message) {
        errorEl.hidden = false
        errorEl.textContent = message
        statusEl.textContent = 'Unable to open the app automatically.'
      }

      const search = window.location.search.startsWith('?') ? window.location.search.slice(1) : window.location.search
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash
      const params = new URLSearchParams([search, hash].filter(Boolean).join('&'))

      const accessToken = params.get('access_token')
      const refreshToken = params.get('refresh_token')
      const type = params.get('type') || 'recovery'

      if (!accessToken || !refreshToken) {
        setError('Reset token missing. Please request a new password reset email.')
        return
      }

      const deepLink = `remedacarepos://reset/?access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}&type=${encodeURIComponent(type)}`
      manualLinkEl.href = deepLink
      manualLinkEl.hidden = false

      statusEl.textContent = 'Opening RemedacarePOS...'
      window.location.replace(deepLink)

      window.setTimeout(() => {
        statusEl.textContent = 'If the app did not open, use the manual link below.'
      }, 1200)
    })()
  </script>
</body>
</html>
